# PRIMARY scheduler for FastBet rounds.
#
# This was the fallback behind Vercel Cron, but the deployment runs on a Vercel
# Hobby account, which rejects any cron finer than once per day — a sub-daily
# `crons` entry in vercel.json fails the deploy outright. So vercel.json now
# declares no crons and this workflow is the only driver. Authorizes with
# `Authorization: Bearer <CRON_SECRET>`.
#
# Trade-off: auto-resolve ticks every 5 minutes here instead of every minute, so
# expired rounds settle later than they would on Vercel Cron. If the account is
# upgraded to Pro, restore the `crons` block in vercel.json and this workflow
# goes back to being a redundant fallback.
#
# Required repo secrets:
#   APP_BASE_URL  - deployed app origin, e.g. https://quantumwagner.vercel.app
#   CRON_SECRET   - must match the CRON_SECRET env var on the deployment
name: cron-fastbets

on:
  # GitHub's smallest interval is 5 minutes (and runs are best-effort).
  schedule:
    - cron: "*/5 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      # generate authorizes cron via its GET handler (its POST stays admin-only,
      # requiring a JWT + ADMIN_RESOLUTION_KEY), so the cron tick uses GET.
      - name: Generate fresh rounds
        run: |
          curl -fsS -X GET "${APP_BASE_URL}/api/fast-bets/generate" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Auto-resolve expired rounds
        run: |
          curl -fsS -X POST "${APP_BASE_URL}/api/fast-bets/auto-resolve" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
quantum_wager = "Quantum1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/devnet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# NOTE: this is a DEVNET-ONLY scaffold. Run `anchor keys sync` after `anchor build`
# to replace the placeholder program id above with your generated keypair id.
